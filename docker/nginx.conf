server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Long-cache the fingerprinted build assets.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths resolve to the app shell so client-side
    # routes survive a hard refresh / deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
