server {
    # Unprivileged port: the image runs as a non-root user (uid 101), which
    # cannot bind < 1024. Publish/route to this port at deploy time.
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Baseline security headers. `always` so they apply to error responses too.
    # CSP + HSTS are intentionally left to the edge/operator (CSP needs the real
    # NUXT_PUBLIC_API_BASE origin in connect-src; HSTS needs TLS termination) —
    # see README "Security headers".
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # Long-cache the fingerprinted build assets.
    location /_nuxt/ {
        # nginx resets inherited add_header when a block defines its own, so the
        # baseline headers above must be repeated here or they are dropped.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Cache-Control          "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths resolve to the app shell so client-side
    # routes survive a hard refresh / deep link. No add_header here → inherits
    # the server-level baseline headers.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
