<!-- Rendered into the static shell before the SPA bundle mounts, so the
     first paint is instant instead of a blank screen. Inline styles only —
     no app CSS is available yet. -->
<div style="position:fixed;inset:0;display:grid;place-items:center;background:#1c1917">
  <span style="width:28px;height:28px;border:3px solid #44403c;border-top-color:#cb9c4b;border-radius:50%;display:block;animation:kc-spin .7s linear infinite"></span>
</div>
<style>@keyframes kc-spin{to{transform:rotate(360deg)}}</style>
